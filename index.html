<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>분식 타이쿤</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="sign">
      <h1>분식 타이쿤</h1>
      <span class="day-tag" id="hud-day">1일차</span>
    </header>

    <!-- 로비 -->
    <section id="screen-lobby" class="screen">
      <div class="stat-row">
        <div class="stat">
          <span class="label">보유 자산</span>
          <strong id="lobby-money">0원</strong>
        </div>
        <div class="stat">
          <span class="label">손님 도감</span>
          <strong id="lobby-collect">0 / 9</strong>
        </div>
      </div>
      <p class="hint" id="lobby-menus">판매 중인 메뉴:</p>
      <div class="btn-col">
        <button class="btn primary big" id="btn-start">영업 시작</button>
        <button class="btn" id="btn-shop">레시피 상점</button>
        <button class="btn" id="btn-collection">손님 도감</button>
        <button class="btn subtle" id="btn-reset">처음부터 다시</button>
      </div>
    </section>

    <!-- 레시피 상점 -->
    <section id="screen-shop" class="screen hidden">
      <div class="screen-head">
        <h2>레시피 상점</h2>
        <span class="money-pill" id="shop-money">0원</span>
      </div>
      <p class="hint">하루 매출을 모아 더 비싸고 효율 좋은 메뉴를 배워보세요.</p>
      <div id="shop-list" class="card-grid"></div>
      <button class="btn" id="btn-shop-back">돌아가기</button>
    </section>

    <!-- 손님 도감 -->
    <section id="screen-collection" class="screen hidden">
      <div class="screen-head"><h2>손님 도감</h2></div>
      <p class="hint">처음 서빙에 성공한 손님이 도감에 등록됩니다. 희귀한 손님일수록 팁을 많이 줍니다.</p>
      <div id="collection-list" class="card-grid"></div>
      <button class="btn" id="btn-col-back">돌아가기</button>
    </section>

    <!-- 하루 영업 -->
    <section id="screen-day" class="screen hidden">
      <div class="hud">
        <div class="stat"><span class="label">남은 시간</span><strong id="hud-time">120초</strong></div>
        <div class="stat"><span class="label">오늘 매출</span><strong id="hud-earn">0원</strong></div>
      </div>
      <p class="msg" id="msg"></p>
      <canvas id="cv" width="640" height="460"></canvas>
    </section>

    <!-- 정산 -->
    <section id="screen-summary" class="screen hidden">
      <div class="screen-head"><h2>오늘 장사 끝!</h2></div>
      <div class="stat-row three">
        <div class="stat"><span class="label">오늘 매출</span><strong id="sum-earn">0원</strong></div>
        <div class="stat"><span class="label">서빙 성공</span><strong id="sum-served">0명</strong></div>
        <div class="stat"><span class="label">놓친 손님</span><strong id="sum-missed">0명</strong></div>
      </div>
      <p class="hint center" id="sum-total"></p>
      <p class="new-box hidden" id="sum-new"></p>
      <div class="btn-col">
        <button class="btn primary big" id="btn-next-day">가게로 돌아가기</button>
        <button class="btn" id="btn-sum-shop">레시피 상점 구경하기</button>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
